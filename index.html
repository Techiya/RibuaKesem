<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ריבוע הקסם ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh; color: #fff; overflow-x: hidden;
    }
    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute; border-radius: 50%; background: #fff;
      animation: twinkle var(--dur,2s) infinite alternate;
      animation-delay: var(--delay,0s);
    }
    @keyframes twinkle {
      from { opacity:.15; transform:scale(1); }
      to   { opacity:1;   transform:scale(1.6); }
    }
    #app { position:relative; z-index:1; max-width:960px; margin:0 auto; padding:20px 16px 40px; }

    /* ── WELCOME ── */
    #welcome { text-align:center; padding:40px 0; }
    .main-title {
      font-size:clamp(2.2rem,6vw,3.6rem); font-weight:900;
      background:linear-gradient(135deg,#ffd700,#ff8c00,#ffd700);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin-bottom:12px; line-height:1.15;
    }
    .welcome-sub { font-size:1.1rem; color:#b0aeff; margin-bottom:48px; }
    .size-cards { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
    .size-card {
      background:linear-gradient(145deg,rgba(102,126,234,.25),rgba(118,75,162,.35));
      border:2px solid rgba(255,255,255,.2); border-radius:24px;
      padding:32px 40px; cursor:pointer;
      transition:transform .25s,box-shadow .25s,border-color .25s;
      color:#fff; font-family:inherit; font-size:1rem; text-align:center; min-width:160px;
    }
    .size-card:hover { transform:translateY(-6px) scale(1.04); box-shadow:0 14px 40px rgba(102,126,234,.55); border-color:gold; }
    .size-card .card-num { display:block; font-size:2.8rem; font-weight:900; color:gold; line-height:1; margin-bottom:8px; }
    .size-card .card-method { font-size:.8rem; color:#a0a0d0; font-style:italic; }

    /* ── GAME ── */
    #game { display:none; }
    .game-header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .back-btn {
      background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.3);
      border-radius:12px; padding:8px 18px; color:#fff; font-family:inherit;
      font-size:.95rem; cursor:pointer; transition:background .2s;
    }
    .back-btn:hover { background:rgba(255,255,255,.2); }
    .header-title { font-size:1.4rem; font-weight:700; }

    /* ── Instructions ── */
    .inst-box { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.18); border-radius:16px; padding:14px 18px; margin-bottom:22px; }
    .inst-toggle { display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:700; font-size:1rem; user-select:none; }
    .inst-toggle .arrow { transition:transform .25s; }
    .inst-toggle.open .arrow { transform:rotate(180deg); }
    .inst-body { margin-top:14px; line-height:1.9; }
    .step-row { display:flex; align-items:flex-start; gap:12px; margin-bottom:10px; }
    .step-badge { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:gold; color:#1a1a2e; font-weight:900; font-size:.85rem; display:flex; align-items:center; justify-content:center; }
    .step-text { color:#d0d0ff; font-size:.93rem; }
    .step-text strong { color:#fff; }

    /* ── Grid ── */
    .game-area { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:16px; }
    .grid-wrap { display:inline-block; }
    .grid-rows { display:flex; flex-direction:column; gap:5px; }
    .grid-row { display:flex; gap:5px; align-items:center; }

    /* Regular cells (3×3, 5×5) */
    .grid-cell {
      width:var(--cell-size,65px); height:var(--cell-size,65px);
      border:2.5px solid rgba(255,255,255,.25); border-radius:12px;
      background:rgba(255,255,255,.07); color:#fff; font-family:inherit;
      font-size:clamp(1rem,3.5vw,1.5rem); font-weight:700; text-align:center;
      outline:none; transition:border-color .2s,background .2s,box-shadow .2s,color .2s;
      -moz-appearance:textfield; appearance:textfield;
    }
    .grid-cell::-webkit-outer-spin-button, .grid-cell::-webkit-inner-spin-button { display:none; }
    .grid-cell:focus { border-color:#818cf8; background:rgba(129,140,248,.18); box-shadow:0 0 0 3px rgba(129,140,248,.3); }
    .grid-cell.state-correct { border-color:#34d399; background:rgba(52,211,153,.14); color:#6ee7b7; }
    .grid-cell.state-wrong   { border-color:#f87171; background:rgba(248,113,113,.14); color:#fca5a5; animation:shake .3s ease; }
    .grid-cell.state-hint    { border-color:gold; background:rgba(255,215,0,.18); box-shadow:0 0 0 3px rgba(255,215,0,.35); animation:pulse-hint 1s ease-in-out infinite; }

    /* 4×4 dual-input cells */
    .cell-4x4 {
      width:var(--cell-size,65px);
      border:2.5px solid rgba(255,255,255,.25); border-radius:12px;
      background:rgba(255,255,255,.07); display:flex; flex-direction:column;
      overflow:hidden; transition:border-color .2s,box-shadow .2s;
    }
    .c4-row { display:flex; align-items:center; padding:4px 5px; gap:3px; flex:1; }
    .c4-row.bot { border-top:1px solid rgba(255,255,255,.15); }
    .c4-inp {
      flex:1; width:0; background:transparent; border:none; outline:none;
      color:#fff; font-family:inherit; font-size:clamp(.75rem,2.2vw,.95rem);
      font-weight:700; text-align:center;
      -moz-appearance:textfield; appearance:textfield;
    }
    .c4-inp::-webkit-outer-spin-button, .c4-inp::-webkit-inner-spin-button { display:none; }
    .c4-inp::placeholder { color:rgba(255,255,255,.2); }
    .c4-sel {
      font-size:.85rem; cursor:pointer; color:rgba(255,255,255,.25);
      transition:color .2s,text-shadow .2s; user-select:none; flex-shrink:0;
    }
    .c4-sel:hover { color:rgba(255,215,0,.7); }
    .c4-sel.sel-active { color:gold; text-shadow:0 0 8px rgba(255,215,0,.6); }
    .c4-sel.hint-choice { color:gold; animation:pulse-icon 1s ease-in-out infinite; }
    .cell-4x4.state-correct { border-color:#34d399; box-shadow:0 0 0 2px rgba(52,211,153,.3); }
    .cell-4x4.state-wrong   { border-color:#f87171; box-shadow:0 0 0 2px rgba(248,113,113,.3); animation:shake .3s; }

    /* Sum indicators — neutral, no magic-sum color coding */
    .row-sum {
      width:48px; min-height:32px; text-align:center; font-size:.95rem; font-weight:700;
      padding:4px 6px; border-radius:8px; display:flex; align-items:center; justify-content:center;
      color:rgba(255,255,255,.55); background:rgba(255,255,255,.06);
    }
    .col-sums-row { display:flex; gap:5px; }
    .col-sum {
      width:var(--cell-size,65px); text-align:center; font-size:.95rem; font-weight:700;
      padding:4px 6px; border-radius:8px;
      color:rgba(255,255,255,.55); background:rgba(255,255,255,.06);
    }
    .col-sums-spacer { width:53px; }
    .diag-sums-row { display:flex; justify-content:space-between; width:100%; padding:0 2px; margin-top:4px; }
    .diag-sum {
      font-size:.9rem; font-weight:700; padding:3px 10px; border-radius:8px;
      color:rgba(255,255,255,.55); background:rgba(255,255,255,.06);
    }

    /* Hidden-sums toggle — use visibility so grid doesn't shift */
    .sums-hidden .row-sum,
    .sums-hidden .col-sums-row,
    .sums-hidden .diag-sums-row { visibility:hidden; }

    /* Animations */
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25%      { transform:translateX(-6px); }
      75%      { transform:translateX(6px); }
    }
    @keyframes pulse-hint {
      0%,100% { box-shadow:0 0 0 3px rgba(255,215,0,.35); }
      50%      { box-shadow:0 0 0 6px rgba(255,215,0,.6); }
    }
    @keyframes pulse-icon {
      0%,100% { text-shadow:0 0 4px rgba(255,215,0,.4); transform:scale(1); }
      50%      { text-shadow:0 0 14px rgba(255,215,0,1); transform:scale(1.5); }
    }
    @keyframes fadeSlide {
      from { opacity:0; transform:translateY(-8px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes popIn {
      from { transform:scale(.6); opacity:0; }
      to   { transform:scale(1);  opacity:1; }
    }
    @keyframes fall {
      0%   { transform:translateY(-60px) rotate(0deg); opacity:1; }
      100% { transform:translateY(110vh) rotate(800deg); opacity:0; }
    }

    /* Progress */
    .progress-wrap { height:7px; background:rgba(255,255,255,.1); border-radius:4px; margin:12px 0; overflow:hidden; }
    .progress-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,#818cf8,gold); transition:width .5s ease; width:0%; }

    /* Hint message */
    .hint-msg {
      display:none; background:rgba(255,215,0,.08); border:2px solid gold;
      border-radius:14px; padding:12px 18px; text-align:center;
      font-size:.95rem; line-height:1.6; animation:fadeSlide .3s ease;
    }

    /* Controls */
    .controls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:18px; }
    .ctrl-btn { border:none; border-radius:14px; padding:11px 22px; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; transition:transform .18s,filter .18s; }
    .ctrl-btn:hover { transform:translateY(-2px); filter:brightness(1.12); }
    .ctrl-btn:active { transform:translateY(0); }
    .btn-hint  { background:linear-gradient(135deg,#f59e0b,#fde68a); color:#1a1a00; }
    .btn-demo  { background:linear-gradient(135deg,#8b5cf6,#c4b5fd); color:#fff; }
    .btn-check { background:linear-gradient(135deg,#10b981,#6ee7b7); color:#fff; }
    .btn-reset { background:linear-gradient(135deg,#ef4444,#fca5a5); color:#fff; }
    .btn-solve { background:linear-gradient(135deg,#3b82f6,#93c5fd); color:#fff; }
    .btn-sums  { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:#d0d0ff; }
    .btn-sums.active { background:rgba(255,215,0,.15); border-color:gold; color:gold; }

    /* Demo msg */
    #demo-msg { display:none; text-align:center; font-size:.9rem; color:#c4b5fd; margin-top:6px; min-height:24px; }

    /* Success overlay */
    #success-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:900; align-items:center; justify-content:center; }
    #success-overlay.show { display:flex; }
    .success-box { background:linear-gradient(145deg,#1a1a3e,#302b63); border:3px solid gold; border-radius:28px; padding:50px 40px; text-align:center; max-width:420px; width:90%; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
    .success-icon  { font-size:4rem; margin-bottom:14px; }
    .success-title { font-size:2rem; font-weight:900; color:gold; margin-bottom:10px; }
    .success-sub   { color:#c0c0ff; font-size:1.1rem; margin-bottom:28px; }
    .success-play-btn { background:gold; color:#1a1a00; border:none; border-radius:14px; padding:14px 32px; font-size:1.1rem; font-family:inherit; font-weight:900; cursor:pointer; transition:filter .2s; }
    .success-play-btn:hover { filter:brightness(1.1); }

    /* Confetti */
    .confetti { position:fixed; pointer-events:none; z-index:1000; animation:fall linear forwards; }

    @media (max-width:500px) { :root { --cell-size:50px; } }
  </style>
</head>
<body>
<div id="stars"></div>
<div id="app">

  <!-- WELCOME -->
  <div id="welcome">
    <h1 class="main-title">✨ ריבוע הקסם ✨</h1>
    <p class="welcome-sub">בחר את גודל הריבוע שתרצה לבנות ותתאמן על השיטה</p>
    <div class="size-cards">
      <button class="size-card" onclick="startGame(3)">
        <span class="card-num">3×3</span>
        <span class="card-method">שיטת הסיאמים</span>
      </button>
      <button class="size-card" onclick="startGame(4)">
        <span class="card-num">4×4</span>
        <span class="card-method">שיטת הפינה הנגדית</span>
      </button>
      <button class="size-card" onclick="startGame(5)">
        <span class="card-num">5×5</span>
        <span class="card-method">שיטת הסיאמים</span>
      </button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="game-header">
      <button class="back-btn" onclick="goBack()">← חזור</button>
      <span class="header-title" id="header-title"></span>
      <div style="width:80px"></div>
    </div>

    <div class="inst-box">
      <div class="inst-toggle open" id="inst-toggle" onclick="toggleInst()">
        <span>📚 כיצד לבנות את ריבוע הקסם?</span>
        <span class="arrow">▼</span>
      </div>
      <div class="inst-body" id="inst-body"></div>
    </div>

    <div class="game-area">
      <div class="grid-wrap sums-hidden" id="grid-wrap">
        <div class="grid-rows" id="grid-rows" dir="ltr"></div>
        <div class="col-sums-row" id="col-sums-row" dir="ltr" style="margin-top:5px;"></div>
        <div class="diag-sums-row" id="diag-sums-row"></div>
      </div>
    </div>

    <div class="progress-wrap"><div class="progress-fill" id="prog"></div></div>
    <div class="hint-msg" id="hint-msg"></div>
    <div id="demo-msg"></div>

    <div class="controls">
      <button class="ctrl-btn btn-hint"  onclick="doHint()">💡 רמז</button>
      <button class="ctrl-btn btn-demo"  onclick="doDemo()">▶️ הדגמה</button>
      <button class="ctrl-btn btn-check" onclick="doCheck()">✅ בדוק</button>
      <button class="ctrl-btn btn-reset" onclick="doReset()">🔄 איפוס</button>
      <button class="ctrl-btn btn-solve" onclick="doSolve()">🔮 פתרון</button>
      <button class="ctrl-btn btn-sums"  id="btn-sums" onclick="toggleSums()">📊 הצג סכומי שורות</button>
    </div>
  </div>
</div>

<div id="success-overlay">
  <div class="success-box">
    <div class="success-icon">🎉</div>
    <div class="success-title">כל הכבוד!</div>
    <div class="success-sub" id="success-sub"></div>
    <button class="success-play-btn" onclick="closeSuccess()">משחק חדש 🚀</button>
  </div>
</div>

<script>
/* ── Stars ── */
(function(){
  const c = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = 1 + Math.random() * 2.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--dur:${1.4+Math.random()*2}s;--delay:${Math.random()*4}s`;
    c.appendChild(s);
  }
})();

/* ── State ── */
let N = 0, solution = [], steps = [];
let hintCell = null, hintChoiceEl = null;
let demoRunning = false, demoAbort = false;
let sumsVisible = false;
let choices4x4 = [];

/* ── Helpers ── */
const magicSum = n => n * (n*n + 1) / 2;
const cellEl   = (r,c) => document.getElementById(`c${r}_${c}`);

function getCellVal(r, c) {
  if (N === 4) {
    const sel = choices4x4[r]?.[c];
    if (!sel) return 0;
    return parseInt(document.getElementById(`c${r}_${c}_${sel}`)?.value) || 0;
  }
  return parseInt(cellEl(r,c)?.value) || 0;
}

function setCellSize() {
  document.documentElement.style.setProperty('--cell-size', (N===3?78:N===4?70:60)+'px');
}

/* ── Solution generators ── */
function solveSiamese(n) {
  const grid = Array.from({length:n}, () => Array(n).fill(0));
  const stps = [];
  let r = 0, c = Math.floor(n/2);
  let nextReason = 'מתחילים עם 1 באמצע השורה העליונה';
  for (let num = 1; num <= n*n; num++) {
    grid[r][c] = num;
    stps.push({row:r, col:c, num, reason:nextReason});
    const nr = (r-1+n)%n, nc = (c+1)%n;
    if (num < n*n) {
      if (grid[nr][nc] !== 0) {
        nextReason = 'התא האלכסוני תפוס – זזים שורה אחת <strong>למטה</strong>';
        r = (r+1)%n;
      } else {
        const wU = r===0, wR = c===n-1;
        if (wU&&wR)      nextReason = 'יצאנו מלמעלה ומימין – עוברים לפינה <strong>השמאלית התחתונה</strong>';
        else if (wU)     nextReason = 'עלינו מעל הריבוע – עוברים לשורה <strong>התחתונה</strong>';
        else if (wR)     nextReason = 'יצאנו מהצד הימני – עוברים לעמודה <strong>השמאלית</strong>';
        else             nextReason = 'צעד אלכסוני: שורה אחת <strong>למעלה</strong>, עמודה אחת <strong>ימינה</strong>';
        r = nr; c = nc;
      }
    }
  }
  return {grid, stps};
}

function solve4x4() {
  const isDiag = (i,j) => i===j || i+j===3;
  const grid = [], stps = [];
  for (let i = 0; i < 4; i++) {
    grid.push([]);
    for (let j = 0; j < 4; j++) {
      const initVal  = i*4 + j + 1;
      const finalVal = isDiag(i,j) ? initVal : 17 - initVal;
      grid[i].push(finalVal);
      const reason = isDiag(i,j)
        ? 'תא על <strong>האלכסון</strong> – לחץ ◎ ליד המספר <strong>העליון</strong>'
        : 'תא <strong>שאינו</strong> על האלכסון – לחץ ◎ ליד המספר <strong>התחתון</strong>';
      stps.push({row:i, col:j, num:finalVal, initVal, isDiag:isDiag(i,j), reason});
    }
  }
  return {grid, stps};
}

/* ── Start / Back ── */
function startGame(size) {
  N = size; demoAbort = true; sumsVisible = false;
  setCellSize();
  const res = N===4 ? solve4x4() : solveSiamese(N);
  solution = res.grid; steps = res.stps;
  if (N===4) choices4x4 = Array.from({length:4}, () => Array(4).fill(null));

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('game').style.display    = 'block';
  document.getElementById('header-title').textContent = `ריבוע ${N}×${N}`;

  const sb = document.getElementById('btn-sums');
  sb.textContent = '📊 הצג סכומי שורות';
  sb.classList.remove('active');

  buildInstructions();
  renderGrid();
}

function goBack() {
  demoAbort = true;
  document.getElementById('game').style.display    = 'none';
  document.getElementById('welcome').style.display = 'block';
  hideHintMsg();
  document.getElementById('demo-msg').style.display = 'none';
}

/* ── Instructions ── */
function buildInstructions() {
  const body = document.getElementById('inst-body');
  document.getElementById('inst-toggle').classList.add('open');
  body.style.display = '';
  const row = (n,h) => `<div class="step-row"><span class="step-badge">${n}</span><span class="step-text">${h}</span></div>`;
  if (N !== 4) {
    body.innerHTML =
      `<p style="color:#b0aeff;margin-bottom:12px;font-size:.9rem;">שיטת הסיאמים (לריבועי אי-זוגי)</p>` +
      row(1,'כתוב <strong>1</strong> באמצע השורה <strong>העליונה</strong>') +
      row(2,'כל מספר הבא: שורה <strong>למעלה</strong> ועמודה <strong>ימינה</strong> (אלכסון)') +
      row(3,'יצאת מלמעלה? → עבור לשורה <strong>התחתונה</strong> באותה עמודה') +
      row(4,'יצאת מהצד הימני? → עבור לעמודה <strong>השמאלית</strong> באותה שורה') +
      row(5,'התא תפוס? → רד <strong>שורה אחת למטה</strong> מהמיקום הקודם');
  } else {
    body.innerHTML =
      `<p style="color:#b0aeff;margin-bottom:12px;font-size:.9rem;">שיטת הפינה הנגדית לריבוע 4×4</p>` +
      row(1,'כתוב <strong>1–16</strong> בסדר: משמאל לימין, מלמעלה למטה <em>(שדה עליון בכל תא)</em>') +
      row(2,'כתוב <strong>1–16</strong> מהפינה הנגדית: מימין לשמאל, מלמטה למעלה <em>(שדה תחתון)</em>') +
      row(3,'בתאים על <strong>האלכסונים</strong> (↘ ו-↙) – לחץ ◎ ליד המספר <strong>העליון</strong>') +
      row(4,'בשאר התאים – לחץ ◎ ליד המספר <strong>התחתון</strong>');
  }
}

function toggleInst() {
  const body = document.getElementById('inst-body');
  const tog  = document.getElementById('inst-toggle');
  const open = tog.classList.toggle('open');
  body.style.display = open ? '' : 'none';
}

/* ── Sum toggle ── */
function toggleSums() {
  sumsVisible = !sumsVisible;
  document.getElementById('grid-wrap').classList.toggle('sums-hidden', !sumsVisible);
  const btn = document.getElementById('btn-sums');
  btn.textContent = sumsVisible ? '📊 הסתר סכומי שורות' : '📊 הצג סכומי שורות';
  btn.classList.toggle('active', sumsVisible);
}

/* ── Render grid ── */
function renderGrid() {
  hintCell = null; hintChoiceEl = null; hideHintMsg();
  const wrap = document.getElementById('grid-wrap');
  wrap.classList.add('sums-hidden');

  const rowsEl    = document.getElementById('grid-rows');
  const colSumsEl = document.getElementById('col-sums-row');
  const diagEl    = document.getElementById('diag-sums-row');
  rowsEl.innerHTML = colSumsEl.innerHTML = diagEl.innerHTML = '';

  for (let i = 0; i < N; i++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'grid-row';
    for (let j = 0; j < N; j++)
      rowDiv.appendChild(N===4 ? make4Cell(i,j) : makeCell(i,j));
    const rs = document.createElement('div');
    rs.className = 'row-sum'; rs.id = `rs${i}`; rs.textContent = '–';
    rowDiv.appendChild(rs);
    rowsEl.appendChild(rowDiv);
  }

  for (let j = 0; j < N; j++) {
    const cs = document.createElement('div');
    cs.className = 'col-sum'; cs.id = `cs${j}`; cs.textContent = '–';
    colSumsEl.appendChild(cs);
  }
  const sp = document.createElement('div'); sp.className = 'col-sums-spacer'; colSumsEl.appendChild(sp);

  const d1 = document.createElement('span'); d1.className='diag-sum'; d1.id='ds1'; d1.textContent='↘ –';
  const d2 = document.createElement('span'); d2.className='diag-sum'; d2.id='ds2'; d2.textContent='– ↙';
  diagEl.appendChild(d2); diagEl.appendChild(d1);

  updateDisplay();
}

function makeCell(i,j) {
  const inp = document.createElement('input');
  inp.type='number'; inp.min=1; inp.max=N*N;
  inp.className='grid-cell'; inp.id=`c${i}_${j}`;
  inp.dataset.r=i; inp.dataset.c=j;
  inp.addEventListener('input', onInput);
  inp.addEventListener('keydown', onKeydown);
  return inp;
}

function make4Cell(i,j) {
  const div = document.createElement('div');
  div.className='cell-4x4'; div.id=`c${i}_${j}`;

  ['t','b'].forEach((s,idx) => {
    const row = document.createElement('div');
    row.className = 'c4-row' + (idx?'  bot':'');
    if (idx) row.classList.add('bot');

    const inp = document.createElement('input');
    inp.type='number'; inp.min=1; inp.max=16;
    inp.className='c4-inp'; inp.id=`c${i}_${j}_${s}`;
    inp.placeholder='–'; inp.dataset.r=i; inp.dataset.c=j; inp.dataset.s=s;
    inp.addEventListener('input', on4Input);

    const sel = document.createElement('span');
    sel.className='c4-sel'; sel.id=`c${i}_${j}_${s}s`;
    sel.textContent='◎'; sel.title='בחר מספר זה';
    sel.addEventListener('click', () => selectChoice(i,j,s));

    row.appendChild(inp); row.appendChild(sel);
    div.appendChild(row);
  });
  return div;
}

/* ── Input handlers ── */
function onInput(e) {
  e.target.value = e.target.value.replace(/[^0-9]/g,'');
  clearHint();
  e.target.classList.remove('state-correct','state-wrong','state-hint');
  updateDisplay(); autoDetectSuccess();
}

function on4Input(e) {
  e.target.value = e.target.value.replace(/[^0-9]/g,'');
  updateDisplay();
}

function onKeydown(e) {
  const r=+e.target.dataset.r, c=+e.target.dataset.c;
  let nr=r, nc=c;
  if      (e.key==='ArrowUp')    nr=Math.max(0,r-1);
  else if (e.key==='ArrowDown')  nr=Math.min(N-1,r+1);
  else if (e.key==='ArrowLeft')  nc=Math.min(N-1,c+1);
  else if (e.key==='ArrowRight') nc=Math.max(0,c-1);
  else if (e.key==='Enter'||e.key==='Tab') {
    e.preventDefault();
    nc=c+1; if(nc>=N){nc=0;nr=r+1;} if(nr>=N)nr=0;
  } else return;
  if(nr!==r||nc!==c) cellEl(nr,nc)?.focus();
}

/* ── 4×4 selection ── */
function selectChoice(i,j,slot) {
  choices4x4[i][j] = slot;
  ['t','b'].forEach(s => document.getElementById(`c${i}_${j}_${s}s`)?.classList.toggle('sel-active', s===slot));
  cellEl(i,j)?.classList.remove('state-correct','state-wrong','state-hint');
  if (hintChoiceEl) { hintChoiceEl.classList.remove('hint-choice'); hintChoiceEl=null; hideHintMsg(); }
  updateDisplay(); autoDetectSuccess();
}

/* ── Display / sums ── */
function updateDisplay() {
  for (let i=0;i<N;i++) {
    let s=0; for(let j=0;j<N;j++) s+=getCellVal(i,j);
    const el=document.getElementById(`rs${i}`); if(el) el.textContent=s>0?s:'–';
  }
  for (let j=0;j<N;j++) {
    let s=0; for(let i=0;i<N;i++) s+=getCellVal(i,j);
    const el=document.getElementById(`cs${j}`); if(el) el.textContent=s>0?s:'–';
  }
  let d1=0,d2=0;
  for(let i=0;i<N;i++){d1+=getCellVal(i,i);d2+=getCellVal(i,N-1-i);}
  const e1=document.getElementById('ds1'), e2=document.getElementById('ds2');
  if(e1) e1.textContent=`↘ ${d1>0?d1:'–'}`;
  if(e2) e2.textContent=`${d2>0?d2:'–'} ↙`;

  let filled=0;
  if (N===4) {
    for(let i=0;i<4;i++) for(let j=0;j<4;j++) if(choices4x4[i][j]!==null) filled++;
  } else {
    for(let i=0;i<N;i++) for(let j=0;j<N;j++) if(getCellVal(i,j)>0) filled++;
  }
  document.getElementById('prog').style.width = ((filled/(N*N))*100)+'%';
}

/* ── Validation ── */
function isValidMagicSquare() {
  const ms=magicSum(N), seen=new Set();
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const v=getCellVal(i,j);
    if(!v||v<1||v>N*N||seen.has(v)) return false;
    seen.add(v);
  }
  if(seen.size!==N*N) return false;
  for(let i=0;i<N;i++){
    let rs=0,cs=0;
    for(let j=0;j<N;j++){rs+=getCellVal(i,j);cs+=getCellVal(j,i);}
    if(rs!==ms||cs!==ms) return false;
  }
  let d1=0,d2=0;
  for(let i=0;i<N;i++){d1+=getCellVal(i,i);d2+=getCellVal(i,N-1-i);}
  return d1===ms&&d2===ms;
}

function autoDetectSuccess() { if(isValidMagicSquare()) setTimeout(showSuccess,400); }

/* ── Hint ── */
function doHint() {
  clearHint();
  const target = steps.find(s => getCellVal(s.row,s.col) !== s.num);
  if (!target) { showHintMsg('🎉 כל המספרים במקומם הנכון! לחץ "בדוק" לאימות.'); return; }

  if (N===4) {
    const slot = target.isDiag ? 't' : 'b';
    hintChoiceEl = document.getElementById(`c${target.row}_${target.col}_${slot}s`);
    if(hintChoiceEl) hintChoiceEl.classList.add('hint-choice');
    showHintMsg(
      `💡 ${target.reason}<br>` +
      `<span style="font-size:.85rem;color:#d4b8ff;">שורה ${target.row+1}, עמודה ${target.col+1}</span>`
    );
  } else {
    hintCell = {row:target.row, col:target.col};
    const inp = cellEl(target.row, target.col);
    inp.classList.add('state-hint'); inp.focus();
    showHintMsg(
      `💡 הנח את המספר <strong>${target.num}</strong> בשורה ${target.row+1}, עמודה ${target.col+1}<br>` +
      `<span style="font-size:.85rem;color:#d4b8ff;">${target.reason}</span>`
    );
  }
}

function clearHint() {
  if(hintCell){ cellEl(hintCell.row,hintCell.col)?.classList.remove('state-hint'); hintCell=null; }
  if(hintChoiceEl){ hintChoiceEl.classList.remove('hint-choice'); hintChoiceEl=null; }
  hideHintMsg();
}

function showHintMsg(h){ const el=document.getElementById('hint-msg'); el.innerHTML=h; el.style.display='block'; }
function hideHintMsg(){ document.getElementById('hint-msg').style.display='none'; }

/* ── Check ── */
function doCheck() {
  clearHint();
  let anyWrong=false, anyEmpty=false;
  if (N===4) {
    for(let i=0;i<4;i++) for(let j=0;j<4;j++){
      const cell=cellEl(i,j);
      cell.classList.remove('state-correct','state-wrong','state-hint');
      if(!choices4x4[i][j]){anyEmpty=true;cell.classList.add('state-wrong');}
      else if(getCellVal(i,j)===solution[i][j]) cell.classList.add('state-correct');
      else{cell.classList.add('state-wrong');anyWrong=true;}
    }
  } else {
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){
      const inp=cellEl(i,j), v=getCellVal(i,j);
      inp.classList.remove('state-correct','state-wrong','state-hint');
      if(!v){anyEmpty=true;continue;}
      if(v===solution[i][j]) inp.classList.add('state-correct');
      else{inp.classList.add('state-wrong');anyWrong=true;}
    }
  }
  if(!anyWrong&&!anyEmpty) showSuccess();
  else if(anyWrong) showHintMsg('❌ יש שגיאות – התאים האדומים אינם נכונים. נסה שוב או לחץ "רמז".');
  else showHintMsg('⚠️ חלק מהתאים עדיין ריקים. המשך למלא את הריבוע!');
}

/* ── Demo ── */
async function doDemo() {
  if(demoRunning){demoAbort=true;return;}
  doReset(true);
  demoAbort=false; demoRunning=true;
  const demoEl=document.getElementById('demo-msg');
  demoEl.style.display='block';
  const delay=ms=>new Promise(r=>setTimeout(r,ms));

  for(const step of steps){
    if(demoAbort) break;
    if(N===4){
      const slot=step.isDiag?'t':'b';
      const tInp=document.getElementById(`c${step.row}_${step.col}_t`);
      const bInp=document.getElementById(`c${step.row}_${step.col}_b`);
      const icon=document.getElementById(`c${step.row}_${step.col}_${slot}s`);
      demoEl.innerHTML=`<strong style="color:gold">תא (${step.row+1},${step.col+1})</strong>: ${step.reason}`;
      if(!tInp.value) tInp.value=step.initVal;
      if(!bInp.value) bInp.value=17-step.initVal;
      updateDisplay();
      icon?.classList.add('hint-choice');
      await delay(600); if(demoAbort) break;
      icon?.classList.remove('hint-choice');
      selectChoice(step.row,step.col,slot);
      cellEl(step.row,step.col)?.classList.add('state-correct');
      await delay(300);
    } else {
      demoEl.innerHTML=`<strong style="color:gold">מספר ${step.num}</strong>: ${step.reason}`;
      const inp=cellEl(step.row,step.col);
      inp.classList.add('state-hint');
      await delay(500); if(demoAbort) break;
      inp.value=step.num;
      inp.classList.remove('state-hint'); inp.classList.add('state-correct');
      updateDisplay(); await delay(350);
    }
  }
  demoEl.style.display='none'; demoRunning=false;
  if(!demoAbort&&isValidMagicSquare()) setTimeout(showSuccess,500);
}

/* ── Reset / Solve ── */
function doReset(silent) {
  demoAbort=true; clearHint();
  if(N===4){
    choices4x4=Array.from({length:4},()=>Array(4).fill(null));
    for(let i=0;i<4;i++) for(let j=0;j<4;j++){
      cellEl(i,j)?.classList.remove('state-correct','state-wrong','state-hint');
      ['t','b'].forEach(s=>{
        const inp=document.getElementById(`c${i}_${j}_${s}`);
        const sel=document.getElementById(`c${i}_${j}_${s}s`);
        if(inp) inp.value='';
        if(sel) sel.classList.remove('sel-active','hint-choice');
      });
    }
  } else {
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){
      const inp=cellEl(i,j);
      if(inp){inp.value='';inp.classList.remove('state-correct','state-wrong','state-hint');}
    }
  }
  updateDisplay();
  if(!silent) hideHintMsg();
  document.getElementById('demo-msg').style.display='none';
}

function doSolve() {
  demoAbort=true; clearHint();
  if(N===4){
    for(const step of steps){
      const tI=document.getElementById(`c${step.row}_${step.col}_t`);
      const bI=document.getElementById(`c${step.row}_${step.col}_b`);
      if(tI) tI.value=step.initVal;
      if(bI) bI.value=17-step.initVal;
      const slot=step.isDiag?'t':'b';
      selectChoice(step.row,step.col,slot);
      cellEl(step.row,step.col)?.classList.add('state-correct');
    }
  } else {
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){
      const inp=cellEl(i,j);
      if(inp){inp.value=solution[i][j];inp.classList.remove('state-wrong','state-hint');inp.classList.add('state-correct');}
    }
  }
  updateDisplay(); hideHintMsg();
}

/* ── Success ── */
function showSuccess(){
  const msgs=[
    `בנית ריבוע קסם ${N}×${N} מושלם! אתה אלוף! 🏆`,
    `מדהים! כל השורות, העמודות והאלכסונים שווים! 🌟`,
    `ריבוע הקסם שלך מושלם! כישרון אמיתי! ✨`
  ];
  document.getElementById('success-sub').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('success-overlay').classList.add('show');
  launchConfetti();
}
function closeSuccess(){
  document.getElementById('success-overlay').classList.remove('show');
  goBack();
}

/* ── Confetti ── */
function launchConfetti(){
  const colors=['#ffd700','#ff6b6b','#4ecdc4','#a8e063','#f093fb','#818cf8','#fb923c'];
  for(let i=0;i<90;i++) setTimeout(()=>{
    const p=document.createElement('div');
    p.className='confetti';
    const sz=6+Math.random()*10;
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};animation-duration:${1.6+Math.random()*2}s;animation-delay:${Math.random()*.6}s;border-radius:${Math.random()>.5?'50%':'3px'};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3200);
  }, i*28);
}
